<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>War Web (Python)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="bar">
    <input id="roomId" placeholder="Sala" value="sala1" />
    <button id="btnJoin">Entrar</button>
    <button id="btnStartTurn" disabled>Iniciar turno</button>
    <button id="btnEndTurn" disabled>Encerrar turno</button>
  </div>

  <div id="status">
    <div>Você: <strong><span id="me">-</span></strong></div>
    <div>Sua missão: <strong><span id="mission">-</span></strong></div>
    <div>Jogador Atual: <strong><span id="currentPlayer">-</span></strong></div>
    <div>Reforços disponíveis: <strong><span id="reinforcements">0</span></strong></div>
    <div>Fase do Turno: <strong><span id="phase">Esperando</span></strong></div>
  </div>

  <div id="map"></div>

  <pre id="log"></pre>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    window.onload = () => {
      const sock = io();

      // Cores dos jogadores, pela cor definida no servidor
      const COLORS = {
        red:    { bg: "#d62828", fg: "white", label: "vermelho" },
        blue:   { bg: "#1d4e89", fg: "white", label: "azul" },
        green:  { bg: "#3a7d44", fg: "white", label: "verde" },
        yellow: { bg: "#fcbf49", fg: "#222",  label: "amarelo" },
        purple: { bg: "#7b2cbf", fg: "white", label: "roxo" },
        black:  { bg: "#1b1b1b", fg: "white", label: "preto" },
      };

      let gameState = null;
      let currentPlayerIndex = null;
      let myPlayerIndex = null;
      let reinforcements = 0;
      let phase = "waiting";
      let selectedTerritory = null;

      const logElement = document.getElementById("log");
      const meElem = document.getElementById("me");
      const missionElem = document.getElementById("mission");
      const currentPlayerElem = document.getElementById("currentPlayer");
      const reinforcementsElem = document.getElementById("reinforcements");
      const phaseElem = document.getElementById("phase");
      const btnStartTurn = document.getElementById("btnStartTurn");
      const btnEndTurn = document.getElementById("btnEndTurn");
      const btnJoin = document.getElementById("btnJoin");
      const mapElem = document.getElementById("map");
      const roomInput = document.getElementById("roomId");

      function log(msg) {
        logElement.textContent += msg + "\n";
        logElement.scrollTop = logElement.scrollHeight;
      }

      function currentRoomId() {
        return roomInput.value.trim() || "default";
      }

      function isMyTurn() {
        return myPlayerIndex !== null && myPlayerIndex === currentPlayerIndex;
      }

      function playerLabel(index) {
        const p = gameState && gameState.players[index];
        const color = p && COLORS[p.color];
        return `Jogador ${index + 1}` + (color ? ` (${color.label})` : "");
      }

      // Guarda o estado recebido do servidor e redesenha o mapa.
      // A fase e os reforços vêm do servidor; fora do próprio turno o jogador só espera.
      function applyState(s) {
        const finishedBefore = gameState !== null && gameState.winnerId !== null;
        gameState = s;
        currentPlayerIndex = s.currentPlayerIndex;
        if (s.winnerId !== null) {
          phase = "finished";
          reinforcements = 0;
        } else if (isMyTurn()) {
          phase = s.phase;
          reinforcements = s.reinforcementsLeft;
        } else {
          phase = "waiting";
          reinforcements = 0;
        }
        if (phase !== "attacking") {
          selectedTerritory = null;
        }
        if (myPlayerIndex !== null) {
          const me = s.players[myPlayerIndex];
          meElem.textContent = playerLabel(myPlayerIndex) + (me.alive ? "" : " - eliminado");
        }
        currentPlayerElem.textContent = playerLabel(currentPlayerIndex);
        if (s.winnerId !== null && !finishedBefore) {
          log(`Fim de jogo! ${playerLabel(s.winnerId)} venceu a partida.`);
        }
        updateControls();
        renderMap(s);
      }

      function updateControls() {
        btnStartTurn.disabled = !(phase === "waiting" && isMyTurn());
        btnEndTurn.disabled = phase !== "attacking";
        if (phase === "finished") {
          phaseElem.textContent = `Fim de jogo - ${playerLabel(gameState.winnerId)} venceu`;
        } else if (phase === "placing") {
          phaseElem.textContent = "Posicionando tropas";
        } else if (phase === "attacking") {
          phaseElem.textContent = "Ataque";
        } else {
          phaseElem.textContent = "Esperando";
        }
        reinforcementsElem.textContent = reinforcements;
      }

      function joinRoom() {
        const roomId = currentRoomId();
        gameState = null;
        myPlayerIndex = null;
        meElem.textContent = "-";
        missionElem.textContent = "-";
        sock.emit("join", { roomId, numPlayers: 3 });
        log(`Entrando na sala "${roomId}"...`);
      }

      function startTurn() {
        sock.emit("start_turn", { roomId: currentRoomId() });
      }

      function endTurn() {
        sock.emit("end_turn", { roomId: currentRoomId() });
      }

      function renderMap(state) {
        mapElem.innerHTML = "";
        Object.values(state.territories).forEach(t => {
          const div = document.createElement("div");
          div.classList.add("territory");
          div.textContent = t.name;
          div.title = `Continente: ${t.continent}\nVizinho(s): ${t.neighbors.join(", ")}`;
          const owner = t.ownerId !== null ? state.players[t.ownerId] : null;
          const color = owner && COLORS[owner.color];
          if (color) {
            div.style.backgroundColor = color.bg;
            div.style.color = color.fg;
          }
          if (t.ownerId === myPlayerIndex) {
            div.classList.add("own");
          }
          const troops = document.createElement("div");
          troops.classList.add("troops");
          troops.textContent = t.armies;
          div.appendChild(troops);

          div.onclick = () => onTerritoryClick(t);
          mapElem.appendChild(div);
        });
      }

      function onTerritoryClick(t) {
        if (phase === "placing") {
          if (t.ownerId !== myPlayerIndex) {
            log("Só pode colocar tropas em territórios que você controla.");
            return;
          }
          // O servidor desconta o reforço e devolve o estado atualizado
          sock.emit("place", { roomId: currentRoomId(), placements: { [t.name]: 1 } });
        } else if (phase === "attacking") {
          if (!selectedTerritory) {
            if (t.ownerId !== myPlayerIndex || t.armies <= 1) {
              log("Selecione um território seu com pelo menos 2 tropas para atacar.");
              return;
            }
            selectedTerritory = t.name;
            log(`Território atacante selecionado: ${t.name}`);
          } else {
            if (t.ownerId === myPlayerIndex) {
              log("Ataque deve ser para território inimigo.");
              selectedTerritory = null;
              return;
            }
            const attackDice = Math.min(3, gameState.territories[selectedTerritory].armies - 1);
            sock.emit("attack", { roomId: currentRoomId(), from: selectedTerritory, to: t.name, dice: attackDice });
            log(`Atacando de ${selectedTerritory} para ${t.name} com ${attackDice} dados.`);
            selectedTerritory = null;
          }
        } else if (phase === "finished") {
          log("A partida já terminou.");
        } else {
          log(isMyTurn() ? "Clique em Iniciar turno." : "Espere o seu turno.");
        }
      }

      sock.on("connect", () => {
        log("Conectado ao servidor.");
        // Entra (ou volta a entrar, após uma reconexão) na sala
        joinRoom();
      });

      sock.on("joined", data => {
        myPlayerIndex = data.playerIndex;
        if (myPlayerIndex === null) {
          meElem.textContent = "Espectador";
        } else {
          log(`Você é o Jogador ${myPlayerIndex + 1}`);
        }
      });

      sock.on("mission", m => {
        missionElem.textContent = m.description;
      });

      sock.on("message", m => log(m.text || JSON.stringify(m)));

      sock.on("state", applyState);

      sock.on("turn_started", p => {
        applyState(p.state);
        if (isMyTurn()) {
          log(`Turno iniciado. Reforços disponíveis: ${p.reinforcements}`);
        } else {
          log(`${playerLabel(p.state.currentPlayerIndex)} iniciou o turno.`);
        }
      });

      sock.on("attack_result", r => {
        log("Resultado do ataque: " + JSON.stringify(r.result));
        applyState(r.state);
        if (r.result.eliminated !== null && r.result.eliminated !== undefined) {
          log(`${playerLabel(r.result.eliminated)} foi eliminado.`);
        }
      });

      btnJoin.addEventListener("click", joinRoom);
      btnStartTurn.addEventListener("click", startTurn);
      btnEndTurn.addEventListener("click", endTurn);
    };
  </script>
</body>
</html>
