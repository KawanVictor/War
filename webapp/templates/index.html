<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>War Web (Python)</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="bar">
    <input id="roomId" placeholder="Sala" value="sala1" maxlength="40" />
    <button id="btnJoin">Entrar</button>
    <button id="btnStartTurn" disabled>Iniciar turno</button>
    <button id="btnFortify" disabled>Remanejar tropas</button>
    <button id="btnEndTurn" disabled>Encerrar turno</button>
    <label class="qty">Tropas por clique
      <select id="qty">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="all">Todas</option>
      </select>
    </label>
  </div>

  <div class="layout">
    <div class="board">
      <p id="hint"></p>

      <div class="panel" id="lobby" hidden>
        <h2>Sala de espera</h2>
        <p id="lobbyInfo"></p>
        <div id="lobbyHost" hidden>
          <label>Total de jogadores
            <select id="numPlayers">
              <option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option>
            </select>
          </label>
          <p id="lobbyBots"></p>
          <button id="btnStartGame">Iniciar partida</button>
        </div>
      </div>

      <div class="panel" id="conquest" hidden>
        <span id="conquestText"></span>
        <input id="occupyCount" type="number" min="1" value="1" />
        <button id="btnOccupy">Mover</button>
      </div>

      <svg id="map" role="img" aria-label="Mapa do jogo" hidden></svg>
    </div>

    <div class="side">
      <div class="panel" id="status">
        <div>Você: <strong><span id="me">-</span></strong></div>
        <div>Sua missão: <strong><span id="mission">-</span></strong></div>
        <div>Jogador Atual: <strong><span id="currentPlayer">-</span></strong></div>
        <div>Reforços disponíveis: <strong><span id="reinforcements">0</span></strong></div>
        <div>Fase do Turno: <strong><span id="phase">Esperando</span></strong></div>
      </div>

      <div class="panel">
        <h2>Jogadores</h2>
        <div id="players"></div>
      </div>

      <div class="panel">
        <h2>Último ataque</h2>
        <div id="dice"><span class="empty">Nenhum ataque ainda.</span></div>
      </div>

      <div class="panel">
        <h2>Suas cartas</h2>
        <div id="cards"><span class="empty">Nenhuma carta.</span></div>
        <button id="btnTrade" disabled>Trocar cartas</button>
      </div>

      <div class="panel">
        <h2>Registro</h2>
        <pre id="log"></pre>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
