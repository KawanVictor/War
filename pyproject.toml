[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "war-game"
version = "0.1.0"
description = "Jogo de tabuleiro War (inspirado em Risk) com CLI e servidor web"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask~=3.0.3",
    "Flask-SocketIO~=5.5.1",
    "eventlet~=0.40.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
war-cli = "war_game.cli.main:main"

[tool.setuptools.packages.find]
include = ["war_game*", "webapp*"]
exclude = ["*.tests"]

[tool.setuptools.package-data]
war_game = ["data/*.json"]
webapp = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["war_game/tests", "webapp/tests"]
pythonpath = ["."]
